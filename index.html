<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>hi luqman</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #ffffff;
    font-family: Arial, sans-serif;
    color: #111;
}

.app {
    width: 100%;
    max-width: 700px;
    height: 100vh;
    margin: auto;
    display: flex;
    flex-direction: column;
}

/* ONLY visible title */

header {
    padding: 18px 20px;
    border-bottom: 1px solid #eee;
    font-size: 18px;
}

/* chat */

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.message {
    max-width: 85%;
    padding: 10px 14px;
    margin: 8px 0;
    border-radius: 16px;
    white-space: pre-wrap;
    line-height: 1.4;
}

.luqman {
    background: #eeeeee;
}

.me {
    background: #111111;
    color: white;
    margin-left: auto;
}

/* input */

.bottom {
    border-top: 1px solid #eee;
    padding: 10px;
    display: flex;
    gap: 8px;
}

textarea {
    flex: 1;
    resize: none;
    min-height: 45px;
    max-height: 150px;
    padding: 11px;
    border: 1px solid #ddd;
    border-radius: 14px;
    font-family: Arial, sans-serif;
    font-size: 15px;
}

button {
    border: none;
    border-radius: 12px;
    padding: 10px 15px;
    background: #111;
    color: white;
    cursor: pointer;
}

button:active {
    transform: scale(.97);
}

/* hidden memory screen */

#memoryScreen {
    display: none;
    position: fixed;
    inset: 0;
    background: white;
    max-width: 700px;
    margin: auto;
    padding: 20px;
    overflow-y: auto;
}

.memory {
    border-bottom: 1px solid #eee;
    padding: 13px 0;
}

.delete {
    background: #eee;
    color: #111;
    margin-top: 7px;
}
</style>
</head>

<body>

<div class="app">

<header>
    hi luqman
</header>

<div id="chat"></div>

<div class="bottom">

<textarea
    id="messageInput"
    placeholder="..."
></textarea>

<button onclick="sendMessage()">
    send
</button>

</div>

</div>


<!--
    Hidden memory screen.
    It is NOT shown on the main interface.
-->

<div id="memoryScreen">

<button onclick="closeMemory()">
    back
</button>

<h2>memory</h2>

<div id="memoryList"></div>

</div>


<script>

/* =========================================================
   STORAGE
========================================================= */

const CHAT_KEY = "hi_luqman_chat";
const MEMORY_KEY = "hi_luqman_memories";

let chatHistory =
    JSON.parse(localStorage.getItem(CHAT_KEY) || "[]");

let memories =
    JSON.parse(localStorage.getItem(MEMORY_KEY) || "[]");


function saveEverything() {

    localStorage.setItem(
        CHAT_KEY,
        JSON.stringify(chatHistory)
    );

    localStorage.setItem(
        MEMORY_KEY,
        JSON.stringify(memories)
    );
}


/* =========================================================
   YOUR ACTUAL KMKJ SCHEDULE
========================================================= */

const schedule = {

    Monday: [
        ["08:00", "09:00", "Physics Lecture"],
        ["09:00", "10:00", "Math Lecture"],
        ["10:00", "12:00", "Basic Engineering Practical"],
        ["12:00", "13:00", "Chemistry Lecture"],
        ["13:00", "14:00", "Break"],
        ["14:00", "15:00", "Physics Tutorial"],
        ["15:00", "16:00", "English"]
    ],

    Tuesday: [
        ["08:00", "09:00", "Basic Engineering Lecture"],
        ["09:00", "10:00", "Math Lecture"],
        ["10:00", "11:00", "Math Tutorial"],
        ["11:00", "12:00", "PAI"],
        ["12:00", "14:00", "Break"],
        ["14:00", "15:00", "Basic Engineering Tutorial"],
        ["15:00", "16:00", "Pengajian Am"]
    ],

    Wednesday: [
        ["08:00", "10:00", "Chemistry Practical"],
        ["10:00", "11:00", "Free"],
        ["11:00", "12:00", "Chemistry Tutorial"],
        ["12:00", "13:00", "English"],
        ["13:00", "14:00", "Break"],
        ["14:00", "15:00", "Math Tutorial"],
        ["15:00", "16:00", "Basic Engineering Tutorial"]
    ],

    Thursday: [
        ["08:00", "09:00", "Chemistry Tutorial"],
        ["09:00", "10:00", "English"],
        ["10:00", "11:00", "Physics Tutorial"],
        ["11:00", "12:00", "Basic Engineering Tutorial"],
        ["12:00", "14:00", "Break"],
        ["14:00", "16:00", "Physics Practical"]
    ],

    Friday: [
        ["08:00", "09:00", "Free"],
        ["09:00", "10:00", "Math Tutorial"],
        ["10:00", "11:00", "Chemistry Tutorial"],
        ["11:00", "12:00", "Physics Tutorial"],
        ["12:00", "16:00", "Free"]
    ]

};


/* =========================================================
   TIME FUNCTIONS
========================================================= */

function toMinutes(time) {

    const parts = time.split(":");

    return (
        Number(parts[0]) * 60 +
        Number(parts[1])
    );
}


function currentActivity() {

    const days = [
        "Sunday",
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday"
    ];

    const now = new Date();

    const day = days[now.getDay()];

    if (!schedule[day]) {

        return {
            day: day,
            activity: "No scheduled class"
        };

    }

    const current =
        now.getHours() * 60 +
        now.getMinutes();

    for (const item of schedule[day]) {

        const start = toMinutes(item[0]);
        const end = toMinutes(item[1]);

        if (
            current >= start &&
            current < end
        ) {

            return {
                day: day,
                activity: item[2],
                start: item[0],
                end: item[1]
            };

        }

    }

    return {
        day: day,
        activity: "Outside class schedule"
    };
}


/* =========================================================
   CHAT DISPLAY
========================================================= */

function addMessage(text, sender) {

    const chat =
        document.getElementById("chat");

    const message =
        document.createElement("div");

    message.className =
        "message " + sender;

    message.textContent = text;

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;
}


function renderChat() {

    const chat =
        document.getElementById("chat");

    chat.innerHTML = "";

    for (const item of chatHistory) {

        addMessage(
            item.text,
            item.sender
        );

    }

}


/* =========================================================
   ADD LUQMAN MESSAGE
========================================================= */

function sendMessage() {

    const input =
        document.getElementById("messageInput");

    const text =
        input.value.trim();

    if (!text) return;


    /*
        IMPORTANT:

        Anything entered here is treated as
        something LUQMAN ACTUALLY SAID.

        AI-generated replies are saved separately
        as "me".
    */

    const luqmanMessage = {

        sender: "luqman",

        text: text,

        timestamp:
            new Date().toISOString()

    };


    chatHistory.push(luqmanMessage);

    saveEverything();

    addMessage(text, "luqman");

    input.value = "";


    /*
        Send it to the AI backend.
    */

    generateReply(text);

}


/* =========================================================
   AI REPLY
========================================================= */

async function generateReply(luqmanText) {

    const activity =
        currentActivity();


    const context = {

        luqman_message: luqmanText,

        current_time:
            new Date().toLocaleString("en-MY"),

        current_schedule:
            activity,

        memories:
            memories,

        recent_conversation:
            chatHistory.slice(-30)

    };


    try {

        const response =
            await fetch("/api/reply", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify(context)

            });


        if (!response.ok) {

            throw new Error(
                "AI server unavailable"
            );

        }


        const data =
            await response.json();


        /*
            ONLY save a memory if the AI says
            Luqman actually stated something
            worth remembering.
        */

        if (
            data.memory &&
            data.memory.trim()
        ) {

            memories.push({

                text: data.memory,

                source: "Luqman",

                timestamp:
                    new Date().toISOString()

            });

        }


        if (data.reply) {

            const reply = {

                sender: "me",

                text: data.reply,

                timestamp:
                    new Date().toISOString()

            };


            chatHistory.push(reply);

            addMessage(
                data.reply,
                "me"
            );

        }


        saveEverything();


    } catch (error) {

        /*
            Don't pretend an AI response exists
            when the backend isn't connected.
        */

        addMessage(
            "ai not connected rn 😭",
            "me"
        );

    }

}


/* =========================================================
   MEMORY
========================================================= */

function showMemory() {

    const screen =
        document.getElementById(
            "memoryScreen"
        );

    screen.style.display =
        "block";


    const list =
        document.getElementById(
            "memoryList"
        );

    list.innerHTML = "";


    if (!memories.length) {

        list.textContent =
            "nothing saved yet";

        return;

    }


    memories.forEach(
        (memory, index) => {

            const div =
                document.createElement("div");

            div.className =
                "memory";


            const text =
                document.createElement("div");

            text.textContent =
                memory.text;


            const source =
                document.createElement("div");

            source.style.fontSize =
                "12px";

            source.style.color =
                "#777";

            source.textContent =
                "actually said by Luqman";


            const deleteButton =
                document.createElement("button");

            deleteButton.className =
                "delete";

            deleteButton.textContent =
                "delete";


            deleteButton.onclick =
                function () {

                    memories.splice(
                        index,
                        1
                    );

                    saveEverything();

                    showMemory();

                };


            div.appendChild(text);

            div.appendChild(source);

            div.appendChild(deleteButton);

            list.appendChild(div);

        }
    );

}


function closeMemory() {

    document.getElementById(
        "memoryScreen"
    ).style.display = "none";

}


/* =========================================================
   SECRET MEMORY ACCESS
   Double-click the title.
========================================================= */

document
    .querySelector("header")
    .addEventListener(
        "dblclick",
        showMemory
    );


/* =========================================================
   ENTER TO SEND
========================================================= */

document
    .getElementById("messageInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


/* =========================================================
   START
========================================================= */

renderChat();

</script>

</body>
</html>
