<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hi luqman</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #09090b;
    color: #f4f4f5;
    font-family: Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
}

.app {
    height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 1px solid #27272a;
    font-size: 20px;
    font-weight: 600;
}

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.message {
    max-width: 82%;
    padding: 12px 15px;
    border-radius: 18px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
}

.user {
    align-self: flex-end;
    background: #27272a;
    border-bottom-right-radius: 5px;
}

.ai {
    align-self: flex-start;
    background: #18181b;
    border-bottom-left-radius: 5px;
}

.typing {
    align-self: flex-start;
    color: #71717a;
    padding: 10px;
}

footer {
    border-top: 1px solid #27272a;
    padding: 12px;
    display: flex;
    gap: 10px;
}

textarea {
    flex: 1;
    resize: none;
    height: 48px;
    border: 0;
    outline: none;
    border-radius: 16px;
    padding: 14px;
    background: #18181b;
    color: white;
    font-size: 15px;
}

button {
    width: 48px;
    height: 48px;
    border: 0;
    border-radius: 50%;
    background: white;
    color: black;
    font-size: 20px;
    cursor: pointer;
}

button:disabled {
    opacity: 0.4;
}

#progress {
    position: fixed;
    left: 0;
    bottom: 0;
    height: 3px;
    width: 0%;
    background: white;
    transition: width .2s;
}
</style>
</head>

<body>

<div class="app">

<header>hi luqman</header>

<main id="chat"></main>

<footer>
    <textarea id="input" placeholder="..."></textarea>
    <button id="send">↑</button>
</footer>

</div>

<div id="progress"></div>

<script type="module">

import {
    CreateMLCEngine
} from "https://esm.run/@mlc-ai/web-llm";

const MODEL = "Llama-3.2-1B-Instruct-q4f16_1-MLC";

let engine = null;
let loading = false;

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const send = document.getElementById("send");
const progress = document.getElementById("progress");

const STORAGE_MESSAGES = "luqman_messages";
const STORAGE_MEMORIES = "luqman_memories";

let messages = JSON.parse(
    localStorage.getItem(STORAGE_MESSAGES) || "[]"
);

let memories = JSON.parse(
    localStorage.getItem(STORAGE_MEMORIES) || "[]"
);

function saveData() {
    localStorage.setItem(
        STORAGE_MESSAGES,
        JSON.stringify(messages)
    );

    localStorage.setItem(
        STORAGE_MEMORIES,
        JSON.stringify(memories)
    );
}

function addMessage(text, type) {

    const div = document.createElement("div");

    div.className = "message " + type;
    div.textContent = text;

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function renderHistory() {

    chat.innerHTML = "";

    for (const message of messages) {

        if (message.role === "luqman") {
            addMessage(message.content, "user");
        }

        if (message.role === "ai") {
            addMessage(message.content, "ai");
        }
    }
}

renderHistory();

async function loadAI() {

    if (engine || loading) return engine;

    loading = true;
    send.disabled = true;

    try {

        engine = await CreateMLCEngine(
            MODEL,
            {
                initProgressCallback: (report) => {

                    if (
                        typeof report.progress === "number"
                    ) {
                        progress.style.width =
                            Math.round(
                                report.progress * 100
                            ) + "%";
                    }
                }
            }
        );

        progress.style.width = "0%";
        send.disabled = false;

        return engine;

    } catch (error) {

        console.error(error);

        progress.style.width = "0%";
        loading = false;
        send.disabled = false;

        alert(
            "AI couldn't start on this browser/device. Check the browser console for the error."
        );

        throw error;
    }
}

const SYSTEM_PROMPT = `
You are an AI that helps the user reply naturally to Luqman.

IMPORTANT:
The user is NOT currently dating Luqman.
They are close friends.
Do not automatically make replies romantic, couple-like, flirty, or sexual.

Luqman is a teacher.

The user's texting style:
- casual
- short
- Malay-English mixed
- uses slang and abbreviations
- sometimes chaotic/random
- uses hahaha/HAHAHA naturally
- uses emojis sometimes
- not overly polished
- not cringe
- not formal
- not constantly flirty
- sounds like a real Malaysian student texting a close friend

The user wants replies that sound like HER, not like an AI.

The user's weekly KMKJ schedule:

Monday:
8-9 Physics
9-10 Math
10-12 Basic Engineering
12-1 Chemistry
2-3 Physics
3-4 English

Tuesday:
8-9 Basic Engineering
9-10 Math
10-11 Math tutorial
11-12 PAI
2-3 Basic Engineering
3-4 Pengajian Am

Wednesday:
8-10 Chemistry practical
11-12 Chemistry tutorial
12-1 English
2-3 Math tutorial
3-4 Basic Engineering tutorial

Thursday:
8-9 Chemistry tutorial
9-10 English
10-11 Physics tutorial
11-12 Basic Engineering tutorial
2-4 Physics practical

Friday:
9-10 Math tutorial
10-11 Chemistry tutorial
11-12 Physics tutorial

Use this schedule only when it naturally matters.

MEMORY RULE:
Only remember facts that Luqman actually tells the user.
Do not invent memories.
Do not treat the user's own statements as things Luqman said.
Do not save temporary/random messages as permanent memories.

When replying, output EXACTLY:

REPLY:
<the natural reply>

MEMORY:
<one useful fact Luqman said, or NONE>

Do not add anything else.
`;

function getRecentHistory() {

    return messages
        .slice(-30)
        .map(m => {

            if (m.role === "luqman") {
                return "Luqman: " + m.content;
            }

            return "User reply: " + m.content;

        })
        .join("\n");
}

async function generateReply(luqmanMessage) {

    const ai = await loadAI();

    const prompt = `
${SYSTEM_PROMPT}

KNOWN MEMORIES:
${memories.join("\n") || "None"}

RECENT CHAT:
${getRecentHistory()}

NEW MESSAGE FROM LUQMAN:
${luqmanMessage}

Generate the user's natural reply now.
`;

    const response =
        await ai.chat.completions.create({

            messages: [
                {
                    role: "user",
                    content: prompt
                }
            ],

            temperature: 0.85,

            max_tokens: 180
        });

    return response.choices[0].message.content.trim();
}

function parseAI(output) {

    let reply = output;
    let memory = null;

    const replyMatch =
        output.match(
            /REPLY:\s*([\s\S]*?)(?=\nMEMORY:|$)/i
        );

    const memoryMatch =
        output.match(
            /MEMORY:\s*([\s\S]*)$/i
        );

    if (replyMatch) {
        reply = replyMatch[1].trim();
    }

    if (memoryMatch) {
        memory = memoryMatch[1].trim();
    }

    if (
        memory &&
        memory !== "NONE" &&
        memory.length > 2
    ) {

        if (!memories.includes(memory)) {
            memories.push(memory);
        }

        // Keep memory reasonably small.
        if (memories.length > 100) {
            memories = memories.slice(-100);
        }
    }

    return {
        reply,
        memory
    };
}

async function sendMessage() {

    const text = input.value.trim();

    if (!text || loading) return;

    input.value = "";

    messages.push({
        role: "luqman",
        content: text
    });

    addMessage(text, "user");
    saveData();

    const typing =
        document.createElement("div");

    typing.className = "typing";
    typing.textContent = "•••";

    chat.appendChild(typing);
    chat.scrollTop = chat.scrollHeight;

    try {

        const raw =
            await generateReply(text);

        const result =
            parseAI(raw);

        typing.remove();

        addMessage(
            result.reply,
            "ai"
        );

        messages.push({
            role: "ai",
            content: result.reply
        });

        saveData();

    } catch (error) {

        console.error(error);

        typing.remove();

        addMessage(
            "AI error 😭 check console",
            "ai"
        );
    }
}

send.addEventListener(
    "click",
    sendMessage
);

input.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();
            sendMessage();
        }
    }
);

</script>

</body>
</html>
